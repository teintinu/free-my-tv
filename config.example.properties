# Free My TV settings. build.sh copies this file to config.properties the first time; edit that one and rebuild.

# Free key from https://www.themoviedb.org/settings/api (the "API Read Access Token" or the "API Key").
# Without it, the home screen still works, just without the trending picks.
tmdb_key=

# Your country (two letters): decides which titles are on which streaming app. US, GB, CA, BR, DE, FR...
tmdb_region=US

# Where the home reads its weather, its sunset (the home turns dark at night), the moon and the tide: Praia das
# Fontes, Beberibe/CE (decimal degrees). Change it to your own beach or city.
latitude=-4.1818
longitude=-38.0801
# The name shown on the weather card (empty = "Weather").
city=Praia das Fontes

# true leaves cartoons and anime (TMDB's Animation genre) out of the picks.
hide_animation=false

# auto (follows the TV), or a language in app/assets/i18n (en, pt, es, de, ru, fr, ja, zh-CN…); LG and Samsung: en, es, pt, de, ru
language=auto

# Android app only: true shows cryptocurrency prices from Binance on the home screen and screensaver.
show_crypto=true

# Android app only: crypto prices in USD, BRL, EUR...
# (a currency Binance has no pairs in, like INR, shows the prices in dollars)
currency=USD

# --- Tide and moon (LG and Samsung home screens) ---
# Where the tide is read: the beach you drive to (decimal degrees). Empty = the city above, which is what a point
# on the coast wants. A point inland is fine too: the services snap it to the nearest sea.
tide_lat=
tide_lon=
# The height (metres, in the tide table's own datum) above which the water reaches the sand track: the home shows
# "beach until ..." below it and "stay off" above it. On the Tábua das Marés for Mucuripe, 0.3 is a safe coast.
tide_beach_level=0.3
# Optional: the association's tide endpoint (the same data as the buggy dashboard: the Tábua das Marés, with its
# exact highs and lows). Without a key the home reads Open-Meteo's marine model, which needs none. Keep it private.
tide_api_key=
# Defaults to https://associacao.teintinu.com/api/passeio; set only to use another pass.
tide_url=
# false hides the moon and the tide from the home screen (they can also be turned off on the TV, in Home Settings).
tide_widget=true

# C, F, or auto (Fahrenheit when the TV is set to the US)
temperature=auto

# true also turns off Google Assistant ("Ok Google"); the remote's mic button stops working
disable_assistant=false

# Streaming services to leave out of the picks even when their app is on the TV, comma separated (on Google TV):
# netflix, prime, disney, hulu, paramount, peacock, globoplay, max, appletv, hotstar, okko, crunchyroll, oneplay.
# For apps the TV ships that you don't subscribe to (Prime Video on a Sony, say).
hide_services=

# Optional: a free Watchmode key (watchmode.com) makes the picks open the title's own page in its app (Prime Video,
# JioHotstar...), not just the app. Without it, they open the app. Keep it private.
watchmode_key=
